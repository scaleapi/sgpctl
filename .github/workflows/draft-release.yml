name: Create Draft Release
run-name: "Draft release v${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The version is free-form operator input. It is read from the environment,
    # never expanded into script text, and checked before anything else runs.
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version format
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Must be semver without a v prefix (e.g. 1.2.3)"
            exit 1
          fi
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Check version is newer than latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName // empty' 2>/dev/null || echo "")
          LATEST="${LATEST#v}"

          if [ -n "$LATEST" ]; then
            # Compare versions using sort -V
            HIGHER=$(printf '%s\n%s' "$LATEST" "$VERSION" | sort -V | tail -1)
            if [ "$HIGHER" = "$LATEST" ]; then
              echo "::error::Version $VERSION is not newer than latest release $LATEST"
              exit 1
            fi
          fi

          echo "Tagging ${TAG} (latest: ${LATEST:-none})"

      # Checked out with the default token and without persisting it; the tag
      # push below authenticates with the App token from its own environment.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag does not already exist
        run: |
          if git tag -l | grep -qx "$TAG"; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      # Scoped to this repository and to contents only, and minted only after
      # the input has been validated.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SGPCTL_SYNC_APP_ID }}
          private-key: ${{ secrets.SGPCTL_SYNC_PRIVATE_KEY }}
          repositories: |
            sgpctl
          permission-contents: write

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # shellcheck disable=SC2016  # the variable must expand at push time, not here
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'
          git tag "$TAG"
          git -c "credential.helper=${helper}" push origin "$TAG"

  check:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.compare.outputs.should-build }}
      sgp-commit: ${{ steps.sgp-sha.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SGPCTL_SYNC_APP_ID }}
          private-key: ${{ secrets.SGPCTL_SYNC_PRIVATE_KEY }}
          repositories: |
            sgp

      - name: Checkout sgp repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: scaleapi/sgp
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: services/sgpctl
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Get latest SGP commit for services/sgpctl
        id: sgp-sha
        run: |
          echo "sha=$(git log -1 --format=%H -- services/sgpctl)" >> "$GITHUB_OUTPUT"

      # The binary reports the version from its package metadata, so the
      # release version has to be the one services/sgpctl/pyproject.toml
      # declares. Bump it in scaleapi/sgp first, then release. validate has
      # already pushed the tag by now, so a mismatch removes it again;
      # otherwise the corrected re-run would stop at "tag already exists".
      - name: Check version matches services/sgpctl/pyproject.toml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          cat > /tmp/pyproject_version.py <<'PYEOF'
          import tomllib
          with open("services/sgpctl/pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PYEOF
          PYPROJECT_VERSION=$(python3 -I /tmp/pyproject_version.py)
          if [ "$PYPROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::Release version ${VERSION} does not match services/sgpctl/pyproject.toml version ${PYPROJECT_VERSION}. Bump pyproject.toml in scaleapi/sgp first."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${VERSION}" \
              || echo "::warning::Could not delete tag v${VERSION}; delete it before retrying."
            exit 1
          fi

      - name: Compare with last release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_SHA: ${{ steps.sgp-sha.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          # Get the sgp-commit.txt asset from the latest release
          LAST_SHA=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | select(.name=="sgp-commit.txt") | .url' 2>/dev/null | xargs -I{} curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" {} 2>/dev/null || echo "")

          echo "Last release SGP commit: ${LAST_SHA:-none}"
          echo "Current SGP commit:      $CURRENT_SHA"

          if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes to services/sgpctl/ since last release — skipping build."
            # No release will be created, so do not leave the tag behind.
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${VERSION}" \
              || echo "::warning::Could not delete tag v${VERSION}; delete it before retrying."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected — proceeding with build."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should-build == 'true'
    strategy:
      matrix:
        include:
          # Linux builds run inside a manylinux_2_28 container (glibc 2.28,
          # AlmaLinux 8 base) so the resulting binary loads on any host with
          # glibc >= 2.28: RHEL/Rocky/AlmaLinux 8+, Ubuntu 20.04+, Debian
          # 11+, Amazon Linux 2023. Building on ubuntu-latest pins the
          # binary's glibc floor to whatever the runner ships (currently
          # 2.39 on ubuntu-24.04), which fails to load on most production
          # bastions. glibc is forward-compatible but not backward-
          # compatible — always build against the oldest glibc you want to
          # support.
          - runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            python_bin: /opt/python/cp312-cp312/bin
            artifact: sgpctl-linux-amd64
          - runner: macos-latest
            artifact: sgpctl-darwin-arm64
          - runner: windows-latest
            artifact: sgpctl-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      # Bundle the interpreter the job already provides (the manylinux cp312
      # build or setup-python's), never one uv would download.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SGPCTL_SYNC_APP_ID }}
          private-key: ${{ secrets.SGPCTL_SYNC_PRIVATE_KEY }}
          repositories: |
            sgp

      # Pinned to the commit the check job inspected, so the version that was
      # verified is the version that gets built, whatever main does meanwhile.
      - name: Checkout sgp repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: scaleapi/sgp
          ref: ${{ needs.check.outputs.sgp-commit }}
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: services/sgpctl
          sparse-checkout-cone-mode: true
          persist-credentials: false

      # actions/setup-python doesn't work inside the manylinux container
      # (the container provides Python at /opt/python/*/bin instead). Use
      # the bundled interpreter on Linux, setup-python everywhere else.
      - name: Setup Python (manylinux container)
        if: matrix.container != ''
        run: echo "${{ matrix.python_bin }}" >> "$GITHUB_PATH"

      - name: Setup Python (host runner)
        if: matrix.container == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install from the lockfile the monorepo maintains (uv.lock) so every
      # platform gets the exact pinned SDK versions, with the `cloud` extra
      # so the agentex-cloud SDKs that the PyInstaller step collects are
      # present. --no-editable installs sgpctl itself as a normal package so
      # its metadata (and therefore the version it reports) ships in the
      # binary. uv comes from the job's own Python so the same steps run
      # inside the manylinux container.
      - name: Install dependencies
        shell: bash
        run: |
          pip install uv==0.13.1
          uv sync --project services/sgpctl --frozen --no-dev --no-editable --extra cloud --python 3.12
          uv pip install --python services/sgpctl/.venv pyinstaller==6.10.0

      # --collect-all is needed for SDKs that use lazy/generated module
      # loading; PyInstaller's static analysis misses submodules that are
      # only imported via __getattr__ or pkg_resources. --no-sync keeps
      # uv from removing the PyInstaller we just added to the environment.
      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run --project services/sgpctl --frozen --no-sync pyinstaller \
            --onefile \
            --name sgpctl \
            --collect-all sgpctl \
            --collect-all scale_gp_beta \
            --collect-all agentex \
            --collect-submodules pydantic \
            --distpath dist \
            --workpath build \
            --specpath build \
            services/sgpctl/sgpctl/cli.py

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mv dist/sgpctl.exe dist/${{ matrix.artifact }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/sgpctl dist/${{ matrix.artifact }}

      - name: Smoke test
        run: |
          ./dist/${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [check, build]
    if: needs.check.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write SGP commit SHA
        env:
          SGP_COMMIT: ${{ needs.check.outputs.sgp-commit }}
        run: |
          echo "$SGP_COMMIT" > artifacts/sgp-commit.txt

      # The tag this build is for, attested with the binaries, so publishing
      # can tell assets built for this release from assets copied over from
      # an older one.
      - name: Write RELEASE_TAG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format"
            exit 1
          fi
          echo "v${VERSION}" > artifacts/RELEASE_TAG

      # One line per binary with a bare file name, so `sha256sum -c` works
      # from the directory the binaries are downloaded into.
      - name: Write SHA256SUMS
        run: |
          for f in artifacts/*/sgpctl-*; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      # Signed build provenance for every asset, bound to this workflow and
      # repository, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*/sgpctl-*
            artifacts/SHA256SUMS
            artifacts/RELEASE_TAG

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # Re-checked here because this job runs in a fresh environment.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format"
            exit 1
          fi
          TAG="v${VERSION}"
          REPO="$GITHUB_REPOSITORY"

          # Create a draft release
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes --draft

          # Upload sgp-commit.txt for future change detection, the checksums,
          # and the attested tag
          gh release upload "$TAG" artifacts/sgp-commit.txt artifacts/SHA256SUMS artifacts/RELEASE_TAG --repo "$REPO"

          # Upload all binaries
          for dir in artifacts/*/; do
            for file in "$dir"*; do
              gh release upload "$TAG" "$file" --repo "$REPO"
            done
          done
