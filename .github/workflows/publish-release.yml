name: Publish Release
run-name: "Publish ${{ github.event.release.tag_name }}"

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  attestations: read

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      # The tag name is chosen by whoever created the release, and git allows
      # shell metacharacters in it. It is handled exactly once, here: read from
      # the environment instead of being expanded into the script text, and
      # rejected unless it is a plain vX.Y.Z. Every later step uses the
      # validated TAG / VERSION / BRANCH. Keep this step first and
      # credential-free; GITHUB_ENV is only written after the check passes.
      - name: Validate release tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag is not a vX.Y.Z version tag; refusing to publish it."
            exit 1
          fi
          {
            echo "TAG=${RAW_TAG}"
            echo "VERSION=${RAW_TAG#v}"
            echo "BRANCH=auto/formula-${RAW_TAG}"
          } >> "$GITHUB_ENV"

      - name: Validate release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)
          for REQUIRED in sgpctl-darwin-arm64 sgpctl-linux-amd64 sgpctl-windows-amd64.exe sgp-commit.txt SHA256SUMS; do
            if ! echo "$ASSETS" | grep -qx "$REQUIRED"; then
              echo "::error::Release $TAG is missing required asset '$REQUIRED'. Releases must be created through the 'Create Draft Release' workflow."
              exit 1
            fi
          done

      # Checked out with the default GITHUB_TOKEN and without persisting it. The
      # formula commit is created locally and pushed later with the App token
      # supplied through that step's environment, so no credential is written
      # into the workspace .git/config.
      - name: Checkout sgpctl repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "sgpctl-darwin-arm64" --pattern "SHA256SUMS" --dir artifacts

      # Asset names prove nothing about where a file came from. Each asset the
      # formula will point at must carry build provenance signed by this
      # repository's draft-release workflow running on main, and the binary
      # must be the one the build recorded in SHA256SUMS. A release assembled
      # any other way stops here, before the formula is touched.
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ASSET in sgpctl-darwin-arm64 SHA256SUMS; do
            gh attestation verify "artifacts/${ASSET}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/draft-release.yml" \
              --source-ref refs/heads/main
          done
          (cd artifacts && grep " sgpctl-darwin-arm64$" SHA256SUMS | sha256sum -c -)

      # No credential in this step; it is the only one that edits files. TAG
      # and VERSION are limited to [v0-9.] by the validation above, so they
      # cannot carry a sed delimiter or metacharacter. The greps fail the job
      # if a substitution silently did not apply.
      - name: Update Homebrew formula
        run: |
          SHA_DARWIN_ARM64=$(sha256sum artifacts/sgpctl-darwin-arm64 | awk '{print $1}')

          sed -i "s|releases/download/v[^/]*/|releases/download/${TAG}/|" Formula/sgpctl.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/sgpctl.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA_DARWIN_ARM64}\"/" Formula/sgpctl.rb

          grep -qF "releases/download/${TAG}/" Formula/sgpctl.rb
          grep -qF "version \"${VERSION}\"" Formula/sgpctl.rb
          grep -qF "sha256 \"${SHA_DARWIN_ARM64}\"" Formula/sgpctl.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/sgpctl.rb
          git commit -m "formula: update sgpctl to ${VERSION}"

      # The App token is minted only now, after every untrusted value has been
      # validated and the commit exists, and it lives only in the next step's
      # environment. That step reads nothing from the release event.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SGPCTL_SYNC_APP_ID }}
          private-key: ${{ secrets.SGPCTL_SYNC_PRIVATE_KEY }}
          repositories: |
            sgpctl

      - name: Open and merge formula PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # git authenticates with a one-off credential helper that reads
          # GH_TOKEN from this step's environment at push time. The helper text
          # names the variable, not its value, so the token is never written to
          # disk or placed on a command line.
          # shellcheck disable=SC2016  # the variable must expand at push time, not here
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'

          # Clean up a stale PR/branch from a prior attempt. Close without
          # --delete-branch: gh would also delete the local branch we are on,
          # taking the formula commit with it. The remote branch is removed on
          # the next line.
          gh pr close "$BRANCH" 2>/dev/null || true
          git -c "credential.helper=${helper}" push origin --delete "$BRANCH" 2>/dev/null || true
          git -c "credential.helper=${helper}" push -u origin "$BRANCH" --force
          HEAD_SHA=$(git rev-parse HEAD)

          # Create PR and merge using app token (bypasses auto-merge restriction).
          # The merge is pinned to the commit this run pushed: if the branch head
          # is anything else by the time we merge, fail instead of landing it.
          gh pr create \
            --title "formula: update sgpctl to ${VERSION}" \
            --body "Automated Homebrew formula update for release ${TAG}." \
            --base main \
            --head "$BRANCH"

          gh pr merge "$BRANCH" --squash --admin --match-head-commit "$HEAD_SHA"

      - name: Revert release to draft and clean up on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${TAG:-}" ]; then
            echo "::error::The release tag failed validation, so nothing was changed; inspect the release manually."
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft
          gh pr close "$BRANCH" 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" 2>/dev/null || true
          echo "::error::Homebrew update failed — release $TAG reverted to draft"
